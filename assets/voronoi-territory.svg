    <path class="cell" d="M650 360L772 317V335L706 360Z" fill="#e34c26"/>
    <path class="cell" d="M706 360L772 335V347L742 360Z" fill="#00b4ab"/>
    <path class="cell" d="M742 360L772 347V360Z" fill="#5a637f"/>
  </g>

  <g fill="#f4f7ff" text-anchor="middle">
