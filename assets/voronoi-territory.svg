<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Tong Haoran's language territory</title>
  <desc id="desc">A generative territory map of programming languages, sized approximately by code volume across original public repositories.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.cell{opacity:.88;transition:opacity .2s}.pulse{animation:pulse 4s ease-in-out infinite}.dash{animation:dash 18s linear infinite}@keyframes pulse{50%{opacity:.72}}@keyframes dash{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.pulse,.dash{animation:none}}
  </style>
  <rect width="1200" height="420" fill="#0b0f16"/>
  <path d="M0 0H1200V420H0Z" fill="none" stroke="#20283a"/>
  <text x="72" y="58" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#e8ecff">Tong Haoran · Territory</text>
  <text x="72" y="81" font-size="10" fill="#7c86b8" letter-spacing="3.2">WHAT I ACTUALLY WRITE · AREA ≈ SHARE · 4,293,757 BYTES MAPPED</text>

  <g stroke="#0b0f16" stroke-width="3" stroke-linejoin="round">
